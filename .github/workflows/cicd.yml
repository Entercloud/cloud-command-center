name: Deploy Cloud Command Center Infrastructure

on:
  push:
    branches:
      - main # Or your default branch
  workflow_dispatch: # Allows manual triggering

permissions:
  id-token: write # Required for OIDC AWS authentication
  contents: read  # Required to checkout the repository

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    environment: production # Optional: if you use GitHub environments

    env:
      # Ensure this AWS_REGION matches the region of your EKS cluster and other resources
      # Based on your main.tf, this should be us-west-2 after the suggested changes
      AWS_REGION: "us-west-2"
      EKS_CLUSTER_NAME: "backstage-cluster" # From your main.tf module "eks"
      # Replace YOUR_AWS_ACCOUNT_ID with your actual AWS account ID
      # You can also store this as a GitHub secret e.g., secrets.AWS_ACCOUNT_ID
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      TERRAFORM_WORKING_DIR: "." # Assuming main.tf is in the root. Adjust if it's in a subdirectory.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActionsOIDCRole # Role name from main.tf
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest # Or pin to a specific version e.g., "1.7.0"
          # terraform_wrapper: true # Uncomment if you want to use the wrapper

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve -input=false
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        # The 'terraform apply' command will handle ACM certificate creation and wait for DNS validation
        # if main.tf is configured correctly with aws_acm_certificate_validation.

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      - name: Configure Kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Verify Backstage Pods
        run: kubectl get pods -n backstage

      - name: Verify Backstage Ingress
        run: kubectl get ingress -n backstage